<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vite-project</title>
</head>
<!-- correct file -->

<body>
  <header class="navbar">
    <h3>Navbar</h3>
  </header>
  <div id="app"></div>

  <main class="SearchEngine">
    <div id="Search">
      <h3> Search Engine </h3>
    </div>

    <div id="dropdown-container">
      <form id="searchForm">
        <input type="text" id="searchInput"><select id="attribute">
          <option value="root">Root</option>
          <option value="wordForm"> Wordform</option>
        </select>

        <div class="p-box">
          <p>Preverb</p>
          <div class="p-scroll">
            <label> <input type="checkbox" name="pvv[]" value="abhí"> abhí </label>
            <label> <input type="checkbox" name="pvv[]" value="abhí prá"> abhí prá </label>
            <label> <input type="checkbox" name="pvv[]" value="anu"> anu </label>
            <label> <input type="checkbox" name="pvv[]" value="ní"> ní </label>
            <label> <input type="checkbox" name="pvv[]" value="ní ā́"> ní ā́ </label>
            <label> <input type="checkbox" name="pvv[]" value="nís">nís </label>
            <label> <input type="checkbox" name="pvv[]" value="prá"> prá </label>
            <label> <input type="checkbox" name="pvv[]" value="práti"> práti </label>
            <label> <input type="checkbox" name="pvv[]" value="puráḥ"> puráḥ </label>
            <label> <input type="checkbox" name="pvv[]" value="pári"> pári </label>
            <label> <input type="checkbox" name="pvv[]" value="pári ā́"> pári ā́ </label>
            <label> <input type="checkbox" name="pvv[]" value="párā"> párā </label>
            <label> <input type="checkbox" name="pvv[]" value="sam"> sam </label>
            <label> <input type="checkbox" name="pvv[]" value="su"> su </label>
            <label> <input type="checkbox" name="pvv[]" value="sám"> sám </label>
            <label> <input type="checkbox" name="pvv[]" value="sám ádhi"> sám ádhi </label>
            <label> <input type="checkbox" name="pvv[]" value="sám ā́"> sám ā́ </label>
            <label> <input type="checkbox" name="pvv[]" value="ud"> ud </label>
            <label> <input type="checkbox" name="pvv[]" value="ví"> ví </label>
            <label> <input type="checkbox" name="pvv[]" value="ví ánu"> ví ánu </label>
            <label> <input type="checkbox" name="pvv[]" value="ví ā́"> ví ā́ </label>
            <label> <input type="checkbox" name="pvv[]" value="ánu"> ánu </label>
            <label> <input type="checkbox" name="pvv[]" value="ápa"> ápa </label>
            <label> <input type="checkbox" name="pvv[]" value="ápi"> ápi </label>
            <label> <input type="checkbox" name="pvv[]" value="áti"> áti </label>
            <label><input type="checkbox" name="pvv[]" value="áva"> áva </label>
            <label> <input type="checkbox" name="pvv[]" value="úd"> úd </label>
            <label> <input type="checkbox" name="pvv[]" value="úpa"> úpa </label>
            <label><input type="checkbox" name="pvv[]" value="ā́"> ā́</label>
            <label> <input type="checkbox" name="pvv[]" value="ā́ pári"> ā́ pári </label>
            <label> <input type="checkbox" name="pvv[]" value="ā́ ví"> ā́ ví </label>
          </div>
        </div>

        <!-- creating a bdy group to try to get it all in a flex row -->
        <div class="form-box">
          <div class="form-filter-panel">
            <!-- TENSE  -->
            <div class="form-filter-group">
              <h4>Tense</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="tensev[]" value="Aor">
                  aor
                </label>
                <label>
                  <input type="checkbox" name="tensev[]" value="Pres">
                  present
                </label>
                <label>
                  <input type="checkbox" name="tensev[]" value="Ipf">
                  imperfect
                </label>
                <label>
                  <input type="checkbox" name="tensev[]" value="Plpf">
                  pluperfect
                </label>
                <label>
                  <input type="checkbox" name="tensev[]" value="Pf">
                  perfect
                </label>
                <label>
                  <input type="checkbox" name="tensev[]" value="Cond">
                  Conditional
                </label>
              </div>
            </div>
            <!-- Usage  -->
            <div class="form-filter-group">
              <h4>Time</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="usage[]" value="past">
                  Past
                </label>
                <label>
                  <input type="checkbox" name="usage[]" value="present">
                  Present
                </label>
                <label>
                  <input type="checkbox" name="usage[]" value="future">
                  Future
                </label>
              </div>
            </div>
            <!-- Mood  -->
            <div class="form-filter-group">
              <h4>Mood</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="mood[]" value="ind">
                  ind
                </label>
                <label>
                  <input type="checkbox" name="mood[]" value="sjv">
                  sjv
                </label>
                <label>
                  <input type="checkbox" name="mood[]" value="opt">
                  opt
                </label>
                <label>
                  <input type="checkbox" name="mood[]" value="ipv">
                  ipv
                </label>
              </div>
            </div>
            <!-- Voice  -->
            <div class="form-filter-group">
              <h4>Voice</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="voice[]" value="act">
                  act
                </label>
                <label>
                  <input type="checkbox" name="voice[]" value="mid">
                  mid
                </label>
                <label>
                  <input type="checkbox" name="voice[]" value="psv">
                  pass
                </label>
              </div>
            </div>
            <!-- Case  -->
            <div class="form-filter-group">
              <h4>Case</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="casee[]" value="nom">
                  nom
                </label>
                <label>
                  <input type="checkbox" name="casee[]" value="gen">
                  gen
                </label>
                <label>
                  <input type="checkbox" name="casee[]" value="dat">
                  dat
                </label>
                <label>
                  <input type="checkbox" name="casee[]" value="acc">
                  acc
                </label>
              </div>
            </div>

            <!-- Gender  -->
            <div class="form-filter-group">
              <h4>Gender</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="gender[]" value="m">
                  Masculine
                </label>
                <label>
                  <input type="checkbox" name="gender[]" value="f">
                  Feminine
                </label>
                <label>
                  <input type="checkbox" name="gender[]" value="n">
                  Neutral
                </label>
              </div>
            </div>

            <!-- Person  -->
            <div class="form-filter-group">
              <h4>Person</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="person[]" value="1">
                  1st
                </label>
                <label>
                  <input type="checkbox" name="person[]" value="2">
                  2nd
                </label>
                <label>
                  <input type="checkbox" name="person[]" value="3">
                  3rd
                </label>
              </div>
            </div>
            <!-- Number  -->

            <div class="form-filter-group">
              <h4>Number</h4>
              <div class="option-box">
                <label>
                  <input type="checkbox" name="number[]" value="sg">
                  Singular
                </label>
                <label>
                  <input type="checkbox" name="number[]" value="pl">
                  Plural
                </label>
                <label>
                  <input type="checkbox" name="number[]" value="du">
                  Dual
                </label>
              </div>
            </div>
          </div>

        </div>


        <div class="filter-box">
          <p> Formal Filters</p>
          <div class="filter-scroll">
            <label><input type="checkbox" value="neg"> Negated</label>
            <label><input type="checkbox" value="aug"> Augmented</label>
          </div>
        </div>
       <div class="filter-box">
          <p>Filters</p>
          <div class="filter-scroll">
            <label><input type="checkbox" value="mod"> Modal</label>
            <label><input type="checkbox" value="hab"> Habitual</label>
            <label><input type="checkbox" value="exp"> Experiential</label>
            <label><input type="checkbox" value="rptv"> Reportive</label>
            <label><input type="checkbox" value="term"> Terminative</label>
            <label><input type="checkbox" value="gnom"> Gnomic</label>
            <label><input type="checkbox" value="univ"> Universal</label>
            <label><input type="checkbox" value="ipfv"> Imperfective</label>
            <label><input type="checkbox" value="rsltv">Resulative</label>
             <label><input type="checkbox" value="dub"> Secure Search</label>
            <label><input type="checkbox" value="altr"> No Alternative Readings</label>
          </div>
        </div>
        <button type="submit">Search</button>
      </form>
    </div>
  </main>
  <div id="Results">
    <h2> Results:</h2>
    <ul id="wordFormList">
    </ul>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
